<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UberDances — Natch & Breda</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}main{max-width:480px;margin:auto;padding:28px 20px}h1{font-size:44px;letter-spacing:-2px;margin:20px 0 5px}h1 span{color:#ff6900}.muted{color:#bbb}section{background:#222;border-radius:18px;padding:20px;margin:24px 0}button,a.play{display:block;box-sizing:border-box;width:100%;padding:17px;border:0;border-radius:13px;background:#ff6900;color:#111;font-weight:800;font-size:17px;text-align:center;text-decoration:none;cursor:pointer}.chip{background:#363636;color:#fff;margin:8px 0}.selected{outline:2px solid #ff6900}#status{min-height:55px;line-height:1.6}.bar{height:8px;background:#444;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#ff6900;transition:width .6s}small{color:#aaa}
h1 { font-size: clamp(32px, 9vw, 44px); }
.poster-link { display: block; margin-top: 24px; border-radius: 18px; }
.poster { display: block; width: 100%; height: auto; border-radius: inherit; }
@media (min-width: 840px) {
  main {
    max-width: 1080px;
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 0 28px;
    align-items: start;
  }
  header, footer { grid-column: 1 / -1; }
}
</style></head><body><main><header><h1>Uber<span>Dances</span> 🍊</h1><b>BY NATCH & BREDA</b><p class="muted">Your favourite set, now delivered at home.</p></header>
<a class="poster-link" href="#order-panel" aria-label="See the order options">
  <img class="poster" src="assets/natch-breda-delivery.jpg" width="1254" height="1254"
       alt="Orange and black UberDances poster showing Natch &amp; Breda delivering their DJ set by scooter.">
</a>
<div>
<section id="order-panel" tabindex="-1"><h2>Choose your mood</h2><button class="chip selected" id="mood">🌅 Morning grooves</button><h2>Your order</h2><p>🎧 5 hours of music</p><p>🎃 Rakete Horror Show — Tanzstube Closing</p><button id="order">Order our set now →</button></section><section><h2>Delivery tracking 🛵</h2><p id="status" role="status">Ready when you are.</p><div class="bar"><div class="fill" id="fill"></div></div><div id="listen" style="display:none;margin-top:20px"><a class="play" href="https://soundcloud.com/natchmusik/raketehalloween" target="_blank" rel="noopener">▶ Listen on SoundCloud</a></div></section>
</div>
<footer><small>Simulated delivery. Real grooves. No actual courier required.</small></footer></main><script>const steps=['Order confirmed! 🍊','Your DJs are packing the grooves 🎧','On the way to your dancefloor 🛵','Delivered! Enjoy the sunrise 🌅'];document.getElementById('order').onclick=()=>{let i=0;document.getElementById('listen').style.display='none';const show=()=>{document.getElementById('status').textContent=steps[i];document.getElementById('fill').style.width=((i+1)*25)+'%';if(i===3)document.getElementById('listen').style.display='block';else{ i++;setTimeout(show,1200)}};show()};</script></body></html>
